<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>Page Not Found — YourPlatform</title>
    <meta name="description" content="The page you're looking for doesn't exist on YourPlatform. Browse thousands of webnovels, discover new genres, and find your next favorite story.">
    <meta name="robots" content="noindex, follow">

    <!-- Canonical -->
    <link rel="canonical" href="https://yourplatform.com/404">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourplatform.com/404">
    <meta property="og:title" content="Page Not Found — YourPlatform">
    <meta property="og:description" content="The page you're looking for doesn't exist. Browse thousands of webnovels on YourPlatform.">
    <meta property="og:site_name" content="YourPlatform">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Page Not Found — YourPlatform">
    <meta name="twitter:description" content="The page you're looking for doesn't exist. Browse thousands of webnovels on YourPlatform.">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }
        .error-page h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff6b6b;
        }
        .error-page h2 {
            font-size: 2rem;
            margin: 0.5rem 0;
        }
        .error-page p {
            font-size: 1.2rem;
            max-width: 500px;
            margin: 1rem 0;
            color: #666;
        }
        .error-page .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 1rem;
        }
        .error-page .btn:hover {
            background: #5a4bd1;
        }
        .error-page .suggestions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-page .suggestions a {
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .error-page .suggestions a:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Oops! The page you're looking for doesn't exist or may have been moved.</p>

        <a href="/" class="btn">🏠 Back to Home</a>

        <div class="suggestions">
            <h4 style="width:100%; margin-bottom:0.5rem; font-weight:normal; color:#888;">Popular Categories:</h4>
            <a href="/genre/fantasy">Fantasy</a>
            <a href="/genre/sci-fi">Sci-Fi</a>
            <a href="/genre/romance">Romance</a>
            <a href="/genre/litrpg">LitRPG</a>
            <a href="/trope/enemies-to-lovers">Enemies to Lovers</a>
            <a href="/rankings">Rankings</a>
        </div>
    </div>
</body>
</html>
