    <!-- Styles -->

    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }
        .error-page h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff6b6b;
        }
        .error-page h2 {
            font-size: 2rem;
            margin: 0.5rem 0;
        }
        .error-page p {
            font-size: 1.2rem;
            max-width: 500px;
            margin: 1rem 0;
            color: #666;
        }
        .error-page .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 1rem;
        }
        .error-page .btn:hover {
            background: #5a4bd1;
        }
        .error-page .suggestions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-page .suggestions a {
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .error-page .suggestions a:hover {
            background: #e0e0e0;
        }
        .error-page .login-prompt {
            margin-top: 1rem;
            padding: 1rem 2rem;
            background: #fff3cd;
            border-radius: 8px;
            border: 1px solid #ffc107;
            color: #856404;
        }
        .error-page .login-prompt a {
            color: #6c5ce7;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1>403</h1>
        <h2>Access Forbidden</h2>
        <p>You don't have permission to access this page.</p>

        <!-- Show this if user is NOT logged in -->
        <div class="login-prompt">
            🔒 <strong>Need access?</strong>
            <a href="/login">Log in</a> to your account or
            <a href="/signup">sign up</a> to get started.
        </div>

        <a href="/" class="btn">🏠 Back to Home</a>

        <div class="suggestions">
            <h4 style="width:100%; margin-bottom:0.5rem; font-weight:normal; color:#888;">Popular Categories:</h4>
            <a href="/genre/fantasy">Fantasy</a>

        </div>
    </div>
